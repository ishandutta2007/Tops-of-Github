<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="25%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#16152b" />
      <stop offset="55%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Orb Gradients -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#93c5fd;#e0e7ff;#ffffff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#c084fc;#38bdf8;#60a5fa" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#fbbf24;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.09" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="blurOrb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="360" rx="20" ry="20" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #cbd5e1;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #e2e8f0;
    }
    .tag-box {
      fill: #0b1120;
      fill-opacity: 0.75;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1;
      rx: 10;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1200" height="360" fill="url(#bgGrad)" />

    <!-- Grid Overlay -->
    <rect width="1200" height="360" fill="url(#grid)" />

    <!-- Animated Glowing Orbs -->
    <circle cx="200" cy="40" r="180" fill="url(#orbGrad1)" filter="url(#blurOrb)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,30; -20,20; 0,0" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="300" r="190" fill="url(#orbGrad2)" filter="url(#blurOrb)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,-30; 20,-40; 0,0" dur="16s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="120" r="130" fill="url(#orbGrad3)" filter="url(#blurOrb)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; -30,20; 0,0" dur="12s" repeatCount="indefinite" />
    </circle>

    <!-- Dynamic Animated Stars / Sparkles -->
    <!-- Star 1 -->
    <g transform="translate(180, 70)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#fbbf24" filter="url(#glowGold)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.7;1.3;0.7" dur="3s" repeatCount="indefinite" />
      </polygon>
    </g>
    <!-- Star 2 -->
    <g transform="translate(1040, 85)">
      <polygon points="0,-8 2.5,-2.5 8,0 2.5,2.5 0,8 -2.5,2.5 -8,0 -2.5,-2.5" fill="#f59e0b" filter="url(#glowGold)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="1s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.6" dur="4s" begin="1s" repeatCount="indefinite" />
      </polygon>
    </g>
    <!-- Star 3 -->
    <g transform="translate(140, 270)">
      <polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.8;1.4;0.8" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
      </polygon>
    </g>
    <!-- Star 4 -->
    <g transform="translate(1080, 260)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#c084fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.5s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.7;1.3;0.7" dur="3.2s" begin="1.5s" repeatCount="indefinite" />
      </polygon>
    </g>
    <!-- Star 5 -->
    <g transform="translate(360, 45)">
      <circle cx="0" cy="0" r="2.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.8s" repeatCount="indefinite" />
      </circle>
    </g>
    <!-- Star 6 -->
    <g transform="translate(850, 50)">
      <circle cx="0" cy="0" r="2.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Main Content Centered -->
    <!-- Pill Badge -->
    <g transform="translate(425, 42)">
      <rect width="350" height="32" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <!-- Pulsing Dot -->
      <circle cx="22" cy="16" r="4.5" fill="#10b981">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="22" cy="16" r="8" fill="#10b981" opacity="0.25">
        <animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" class="badge-text">CURATED GITHUB SHOWCASE &amp; INSIGHTS</text>
    </g>

    <!-- Title with Dynamic Gradient Animation -->
    <g transform="translate(600, 138)">
      <!-- Octocat GitHub Icon -->
      <path d="M -235 -28 c -16.5 0 -30 13.5 -30 30 c 0 13.2 8.6 24.4 20.5 28.4 c 1.5 0.3 2 -0.7 2 -1.5 c 0 -0.7 0 -2.7 0 -5.2 c -8.4 1.8 -10.2 -4 -10.2 -4 c -1.4 -3.5 -3.4 -4.4 -3.4 -4.4 c -2.7 -1.9 0.2 -1.8 0.2 -1.8 c 3 0.2 4.6 3.1 4.6 3.1 c 2.7 4.6 7.1 3.3 8.8 2.5 c 0.3 -2 1.1 -3.3 2 -4 c -6.7 -0.8 -13.7 -3.3 -13.7 -14.9 c 0 -3.3 1.2 -6 3.1 -8.1 c -0.3 -0.8 -1.4 -3.8 0.3 -8 c 0 0 2.5 -0.8 8.3 3.1 c 2.4 -0.7 5 -1 7.6 -1 c 2.6 0 5.2 0.3 7.6 1 c 5.8 -3.9 8.3 -3.1 8.3 -3.1 c 1.7 4.2 0.6 7.2 0.3 8 c 2 2.1 3.1 4.8 3.1 8.1 c 0 11.6 -7 14.1 -13.7 14.8 c 1.1 0.9 2.1 2.8 2.1 5.6 c 0 4.1 0 7.3 0 8.3 c 0 0.8 0.6 1.8 2.1 1.5 c 11.9 -4 20.5 -15.2 20.5 -28.4 c 0 -16.5 -13.5 -30 -30 -30 z" 
            fill="#ffffff" fill-opacity="0.9" transform="scale(0.85) translate(20, -10)" />
      
      <text text-anchor="middle" class="title" fill="url(#textGrad)" x="20" y="0">Tops-of-Github</text>
    </g>

    <!-- Subtitle -->
    <text text-anchor="middle" class="subtitle" x="600" y="180">
      Tracking the most starred open-source repositories, languages, and global distributions
    </text>

    <!-- Dynamic Pulse Line underneath Subtitle -->
    <g transform="translate(450, 205)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
      <line x1="60" y1="0" x2="240" y2="0" stroke="url(#textGrad)" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="x1" values="20;140;20" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="160;280;160" dur="4s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Feature / Metric Tags -->
    <!-- Tag 1: Top 100 Repos -->
    <g transform="translate(150, 245)">
      <rect width="200" height="42" class="tag-box" />
      <!-- Star Icon -->
      <polygon points="26,14 29,21 37,22 31,27 33,34 26,30 19,34 21,27 15,22 23,21" fill="#fbbf24" />
      <text x="46" y="26" class="tag-text">Top 100 Repositories</text>
    </g>

    <!-- Tag 2: Global Demographics -->
    <g transform="translate(370, 245)">
      <rect width="215" height="42" class="tag-box" />
      <!-- Globe Icon -->
      <g transform="translate(20, 12)" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9" r="8" />
        <line x1="1" y1="9" x2="17" y2="9" />
        <path d="M9 1a12 12 0 0 1 3 8 12 12 0 0 1-3 8 12 12 0 0 1-3-8 12 12 0 0 1 3-8z" />
      </g>
      <text x="46" y="26" class="tag-text">Global Demographics</text>
    </g>

    <!-- Tag 3: Auto-Updated Analytics -->
    <g transform="translate(605, 245)">
      <rect width="215" height="42" class="tag-box" />
      <!-- Activity/Analytics Icon -->
      <g transform="translate(20, 12)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 9 13.5 9 11.5 16 7 2 5 9 1 9" />
      </g>
      <text x="46" y="26" class="tag-text">Auto-Updated Insights</text>
    </g>

    <!-- Tag 4: Language Benchmarks -->
    <g transform="translate(840, 245)">
      <rect width="210" height="42" class="tag-box" />
      <!-- Code Icon -->
      <g transform="translate(20, 12)" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="12 14 16 9 12 4" />
        <polyline points="6 4 2 9 6 14" />
      </g>
      <text x="46" y="26" class="tag-text">Language Metrics</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" ry="20" fill="none" stroke="url(#cardBorder)" stroke-width="1.2" />
</svg>
